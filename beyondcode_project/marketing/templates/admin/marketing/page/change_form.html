   <!-- GrapesJS JS -->
  <link href="https://unpkg.com/grapesjs/dist/css/grapes.min.css" rel="stylesheet"/>
  <script src="https://unpkg.com/grapesjs"></script>

<script>
    // Get CSRF token function (cookie-based)
    function getCSRFToken() {
        return document.cookie
            .split('; ')
            .find(row => row.startsWith('csrftoken'))
            ?.split('=')[1];
    }

    // Inline GrapesJS widget initialization to ensure it's available
    window.initializeGrapesJS = function(editorId, options, initialData) {
        const editor = grapesjs.init({
            container: `#${editorId}`,
            fromElement: false,
            height: options.height || '600px',
            width: options.width || 'auto',
            storageManager: false,
            plugins: options.plugins || [],
            pluginsOpts: options.pluginsOpts || {},
            
            // Asset Manager Configuration for Image Upload
            assetManager: {
                upload: '/upload-image',
                uploadName: 'files',
                autoAdd: true,
                dropzone: true,
                credentials: 'include', 
                openAssetsOnDrop: true,
                headers: {
                    'X-CSRFToken': getCSRFToken()
                }
            },
            
            blockManager: {
                appendTo: '#blocks-canvas',
            },
            
            styleManager: {
                sectors: [{
                    name: 'General',
                    open: false,
                    buildProps: ['float', 'display', 'position', 'top', 'right', 'left', 'bottom']
                }, {
                    name: 'Flex',
                    open: false,
                    buildProps: ['flex-direction', 'flex-wrap', 'justify-content', 'align-items', 'align-content', 'order', 'flex-grow', 'flex-shrink', 'flex-basis']
                }, {
                    name: 'Dimension',
                    open: false,
                    buildProps: ['width', 'height', 'max-width', 'min-height', 'margin', 'padding']
                }, {
                    name: 'Typography',
                    open: false,
                    buildProps: ['font-family', 'font-size', 'font-weight', 'letter-spacing', 'color', 'line-height', 'text-align', 'text-shadow']
                }, {
                    name: 'Decorations',
                    open: false,
                    buildProps: ['border-radius-c', 'background-color', 'border', 'box-shadow', 'background']
                }, {
                    name: 'Extra',
                    open: false,
                    buildProps: ['transition', 'transform']
                }],
            },
            
            panels: {
                defaults: [
                    {
                        id: 'commands',
                        buttons: [
                            {
                                id: 'undo',
                                className: 'fa fa-undo',
                                command: 'core:undo',
                                attributes: { title: 'Undo' }
                            },
                            {
                                id: 'redo',
                                className: 'fa fa-repeat',
                                command: 'core:redo',
                                attributes: { title: 'Redo' }
                            }
                        ]
                    },
                    {
                        id: 'options',
                        buttons: [
                            {
                                id: 'preview',
                                className: 'fa fa-eye',
                                command: 'preview',
                                attributes: { title: 'Preview' }
                            },
                            {
                                id: 'fullscreen',
                                className: 'fa fa-arrows-alt',
                                command: 'fullscreen',
                                attributes: { title: 'Fullscreen' }
                            }
                        ]
                    },
                    {
                        id: 'views',
                        buttons: [
                            {
                                id: 'open-sm',
                                className: 'fa fa-paint-brush',
                                command: 'open-sm',
                                attributes: { title: 'Open Style Manager' }
                            },
                            {
                                id: 'open-tm',
                                className: 'fa fa-cog',
                                command: 'open-tm',
                                attributes: { title: 'Open Layer Manager' }
                            },
                            {
                                id: 'open-blocks',
                                className: 'fa fa-th-large',
                                command: 'open-blocks',
                                attributes: { title: 'Open Blocks' }
                            }
                        ]
                    }
                ]
            },
            
            blockManager: {
                appendTo: '#blocks-canvas',
            }
        });

        // Add custom blocks
        addCustomBlocks(editor);
        
        // Add layout blocks
        addLayoutBlocks(editor);
        
        // Fix Image Upload Issues
        fixImageUpload(editor);
        
        // Handle data loading
        if (initialData && Object.keys(initialData).length > 0) {
            if (initialData.html && initialData.css) {
                editor.setComponents(initialData.html);
                editor.setStyle(initialData.css);
            } else if (initialData.html) {
                editor.setComponents(initialData.html);
            } else if (initialData.blocks) {
                editor.setComponents(initialData.blocks);
            }
        }

        // Handle data saving
        const textarea = document.getElementById(`${editorId}_textarea`);
        
        editor.on('component:add component:remove component:update', function() {
            const html = editor.getHtml();
            const css = editor.getCss();
            const data = {
                html: html,
                css: css,
                components: editor.getComponents(),
                style: editor.getStyle()
            };
            
            if (textarea) {
                textarea.value = JSON.stringify(data);
            }
        });

        setTimeout(() => {
            const html = editor.getHtml();
            const css = editor.getCss();
            const data = {
                html: html,
                css: css,
                components: editor.getComponents(),
                style: editor.getStyle()
            };
            
            if (textarea) {
                textarea.value = JSON.stringify(data);
            }
        }, 100);

        return editor;
    };

    /**
     * Fix Image Upload Issues
     * Addresses: click not opening file dialog, missing HTML input, drag-drop not working
     */
    function fixImageUpload(editor) {
        // Debug: Log the upload URL being used
        console.log('UPLOAD URL:', '/upload-image');
        
        // 1. Enable file picker manually because default trigger is not working
        editor.AssetManager.getConfig().uploadFile = function(e) {
            const files = e.dataTransfer ? e.dataTransfer.files : e.target.files;
            const formData = new FormData();

            for (let i = 0; i < files.length; i++) {
                formData.append('files', files[i]);
            }

            // Hard override uploadFile to force correct endpoint
            fetch('/upload-image', {
                method: 'POST',
                body: formData,
                credentials: 'include',   // 🔥 REQUIRED
                headers: {
                    'X-CSRFToken': getCSRFToken()
                }
            })
            .then(res => res.json())
            .then(data => {
                editor.AssetManager.add(data.data);
            })
            .catch(err => console.error('Upload error:', err));
        };

        // 2. Fix "click not opening file dialog" by forcing input trigger
        editor.on('asset:open', () => {
            const input = document.querySelector('.gjs-am-file-input');
            if (input) {
                input.click();
            }
        });

        // 3. Ensure HTML input exists (GrapesJS sometimes fails to render it)
        setTimeout(() => {
            if (!document.querySelector('.gjs-am-file-input')) {
                const input = document.createElement('input');
                input.type = 'file';
                input.multiple = true;
                input.className = 'gjs-am-file-input';
                input.style.display = 'none';
                input.accept = 'image/*';
                document.body.appendChild(input);

                input.addEventListener('change', (e) => {
                    editor.AssetManager.getConfig().uploadFile(e);
                });
            }
        }, 1000);

        // 4. Ensure drag-drop works by configuring asset manager properly
        const assetManager = editor.AssetManager;
        const config = assetManager.getConfig();
        
        // Make sure dropzone is enabled
        if (config.dropzone !== true) {
            config.dropzone = true;
            config.openAssetsOnDrop = true;
        }

        // 5. Add event listener for drag and drop on the editor container
        const editorContainer = document.querySelector(`#${editor.getConfig().container.replace('#', '')}`);
        if (editorContainer) {
            editorContainer.addEventListener('dragover', (e) => {
                e.preventDefault();
                e.stopPropagation();
            });

            editorContainer.addEventListener('drop', (e) => {
                e.preventDefault();
                e.stopPropagation();
                
                if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                    editor.AssetManager.getConfig().uploadFile(e);
                }
            });
        }
    }

<script>
    // Initialize all GrapesJS editors after page load
    document.addEventListener('DOMContentLoaded', function() {
        // Find all GrapesJS containers and initialize them
        const containers = document.querySelectorAll('.grapesjs-container');
        containers.forEach(function(container) {
            const editorDiv = container.querySelector('.grapesjs-editor');
            const textarea = container.querySelector('.grapesjs-textarea');
            
            if (editorDiv && textarea) {
                const editorId = editorDiv.id;
                const initialData = JSON.parse(textarea.value || '{}');
                
                // Initialize the editor
                if (typeof initializeGrapesJS !== 'undefined') {
                    initializeGrapesJS(editorId, {height: '600px', width: 'auto', storageManager: false}, initialData);
                }
            }
        });
    });
</script>
