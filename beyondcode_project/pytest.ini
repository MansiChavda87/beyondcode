[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test execution
addopts = 
    --verbose
    --tb=short
    --strict-markers
    --strict-config
    --disable-warnings
    --cov=marketing
    --cov=tests
    --cov-report=html:htmlcov
    --cov-report=term-missing
    --cov-report=xml
    --cov-fail-under=80

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    performance: marks tests as performance tests
    security: marks tests as security tests
    e2e: marks tests as end-to-end tests
    tdd: marks tests as TDD tests

# Django settings
DJANGO_SETTINGS_MODULE = beyondcode_project.settings

# Filter warnings
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Minimum version
minversion = 6.0

# Test timeout (in seconds)
timeout = 300

# Parallel execution
# Uncomment if pytest-xdist is installed
# addopts = --numprocesses=auto

# Test collection
norecursedirs = 
    migrations
    __pycache__
    .git
    .tox
    dist
    build
    *.egg